services:
  web:
    build: .
    ports:
      - "5001:5000"
    environment:
      DB_HOST: db
      DB_NAME: ventas
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      - db
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ventas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - datos_postgres:/var/lib/postgresql/data

volumes:
  datos_postgres:
